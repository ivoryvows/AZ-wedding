
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ayzal Fatemah & Zubair Ali</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Allura&family=Marcellus&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    overflow: hidden;
    background: #100b08;
}

html.site-open,
body.site-open {
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}

/* PAGE 1 - GATES */

.scene {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100svh;
    height: 100dvh;
    overflow: hidden;
    perspective: 1400px;
}

.background {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
}

/* INVITATION TEXT */

.intro {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 18px;
    pointer-events: none;
}

.intro-content {
    width: 100%;
    max-width: 700px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: clamp(5px, 1.2vh, 12px);
    transform: translateY(7vh);
}

.intro-line {
    opacity: 0;
    transform: translateY(18px);
    filter: blur(4px);
    color: #5A1725;
    text-shadow: 0 1px 3px rgba(255,225,195,.65);
}

.bismillah {
    font-family: 'Amiri', serif;
    font-size: clamp(21px, 4.5vw, 32px);
    font-weight: 400;
    color: #68202E;
    direction: rtl;
    line-height: 1.7;
    text-shadow: 0 1px 4px rgba(255,225,195,.7);
}

.verse {
    font-family: 'EB Garamond', serif;
    font-size: clamp(16px, 3.5vw, 21px);
    font-style: italic;
    letter-spacing: .6px;
    color: #762D3A;
}

.families {
    font-family: 'Marcellus', serif;
    font-size: clamp(11px, 2.7vw, 15px);
    letter-spacing: 4px;
    color: #4F1421;
    margin-top: 5px;
}

.name {
    font-family: 'Allura', cursive;
    font-size: clamp(39px, 8.5vw, 65px);
    font-weight: 400;
    line-height: 1.12;
    color: #501321;
    text-shadow: 0 1px 3px rgba(255,225,195,.75);
}

.ampersand {
    font-family: 'EB Garamond', serif;
    font-size: clamp(23px, 5vw, 34px);
    font-style: italic;
    color: #873D49;
}

.request {
    font-family: 'EB Garamond', serif;
    font-size: clamp(17px, 3.8vw, 23px);
    line-height: 1.4;
    max-width: 450px;
    color: #682331;
    margin-top: 5px;
}

/* TEXT REVEAL */

@keyframes textReveal {
    from {
        opacity: 0;
        transform: translateY(18px);
        filter: blur(4px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
    }
}

.opening .intro-line {
    animation: textReveal .8s ease forwards;
}

.opening .line-1 { animation-delay: 5.85s; }
.opening .line-2 { animation-delay: 6.65s; }
.opening .line-3 { animation-delay: 7.45s; }
.opening .line-4 { animation-delay: 8.25s; }
.opening .line-5 { animation-delay: 9.05s; }
.opening .line-6 { animation-delay: 9.85s; }
.opening .line-7 { animation-delay: 10.65s; }

/* GATES */

.gate {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    overflow: hidden;
    z-index: 3;
    transform-style: preserve-3d;
}

.gate-image {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: fill;
}

.left-gate {
    left: 0;
    transform-origin: left center;
}

.right-gate {
    right: 0;
    transform-origin: right center;
}

/* BROOCH */

.brooch-half {
    position: absolute;
    top: 50%;
    width: clamp(120px, 28vw, 260px);
    height: auto;
    max-height: 50vh;
    object-fit: contain;
    z-index: 4;
    pointer-events: none;
}

.brooch-left {
    left: 100%;
    transform: translate(-50%, -50%);
}

.brooch-right {
    left: 0;
    transform: translate(-50%, -50%);
}

/* LED RING */

.led-ring {
    position: absolute;
    top: 50%;
    width: clamp(120px, 28vw, 260px);
    aspect-ratio: 1;
    z-index: 5;
    pointer-events: none;
}

.left-led {
    left: 100%;
    transform: translate(-50%, -50%);
}

.right-led {
    left: 0;
    transform: translate(-50%, -50%);
}

.led-orbit {
    position: absolute;
    width: 42%;
    height: 42%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.led-dot {
    position: absolute;
    width: clamp(4px, 1vw, 7px);
    height: clamp(4px, 1vw, 7px);
    border-radius: 50%;
    background: #fff3c4;
    opacity: 0;
    transform: translate(-50%, -50%) scale(.5);
}

.led-dot:nth-child(1) {left:50%;top:0%}
.led-dot:nth-child(2) {left:75%;top:6.7%}
.led-dot:nth-child(3) {left:93.3%;top:25%}
.led-dot:nth-child(4) {left:100%;top:50%}
.led-dot:nth-child(5) {left:93.3%;top:75%}
.led-dot:nth-child(6) {left:75%;top:93.3%}
.led-dot:nth-child(7) {left:50%;top:100%}
.led-dot:nth-child(8) {left:25%;top:93.3%}
.led-dot:nth-child(9) {left:6.7%;top:75%}
.led-dot:nth-child(10) {left:0%;top:50%}
.led-dot:nth-child(11) {left:6.7%;top:25%}
.led-dot:nth-child(12) {left:25%;top:6.7%}

/* SEQUENTIAL LIGHTS */

.opening .led-dot {
    animation: ledLight .55s ease forwards;
    animation-delay: calc(var(--i) * .22s);
}

@keyframes ledLight {
    to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
        background: #fff5d0;
        box-shadow:
        0 0 4px 2px rgba(255,235,170,.75),
        0 0 9px 3px rgba(240,190,95,.45);
    }
}

/* GATE OPENING */

.opening .left-gate {
    animation: swingLeft 2.6s cubic-bezier(.65,0,.25,1) 3.1s forwards;
}

.opening .right-gate {
    animation: swingRight 2.6s cubic-bezier(.65,0,.25,1) 3.1s forwards;
}

@keyframes swingLeft {
    to { transform: rotateY(-100deg); }
}

@keyframes swingRight {
    to { transform: rotateY(100deg); }
}

/* TAP TO OPEN */

.tap-area {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 9vh;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity .4s ease, visibility .4s ease;
}

.tap-text {
    color: #f9e7c0;
    font-family: Georgia, serif;
    font-size: 13px;
    letter-spacing: 5px;
    text-shadow: 0 0 12px #d4a44c;
    animation: breathe 2s infinite;
}

@keyframes breathe {
    0%,100% {opacity:.5}
    50% {opacity:1}
}

.opening .tap-area {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

/* PAGE DOTS */

.page-dots {
    position: fixed;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity .8s ease;
}

body.site-open .page-dots {
    opacity: 1;
}

.dots-pill {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 9px 6px;
    border-radius: 22px;
    background: rgba(247,235,211,.25);
    border: 1px solid rgba(218,180,115,.5);
    box-shadow: 0 3px 12px rgba(35,20,10,.12);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}

.page-dot {
    width: 5px;
    height: 5px;
    display: block;
    border-radius: 50%;
    background: rgba(195,151,83,.65);
    transition: all .35s ease;
}

.page-dot.active {
    width: 7px;
    height: 7px;
    background: #f5d493;
    box-shadow:
        0 0 0 2px rgba(232,198,137,.2),
        0 0 7px 2px rgba(224,184,105,.65);
}

/* PAGE 2 - THREE PART SCROLL */

.scroll-section {
    position: relative;
    width: 100%;
    height: 280vh;
    background: #e9ddc6;
}

.scroll-stage {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    height: 100svh;
    height: 100dvh;
    overflow: hidden;
    isolation: isolate;
}

.scroll-section.is-pinned .scroll-stage {
    position: fixed;
    top: 0;
    left: 0;
}

.scroll-section.is-ended .scroll-stage {
    position: absolute;
    top: auto;
    bottom: 0;
    left: 0;
}

.scroll-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
}

/* SCROLL COMPOSITION */

.scroll-composition {
    --spread: 0px;

    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);

    /* MESSAGE SIZE UNCHANGED */
    width: min(58vw, 330px);

    z-index: 2;
}

/* MIDDLE MESSAGE */

.scroll-middle {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: calc(var(--spread) * 2);
    transform: translateY(-50%);
    overflow: hidden;
    z-index: 1;
    will-change: height;
}

.scroll-middle img {
    position: absolute;
    top: 50%;
    left: 0;
    display: block;
    width: 100%;
    height: auto;
    transform: translateY(-50%);
}

/* TOP ROLL - MEETS CENTER, MOVES UP */

.scroll-top {
    position: absolute;
    left: -20%;
    top: 50%;
    display: block;
    width: 140%;
    height: auto;
    z-index: 3;

    /* CLOSED: BOTTOM EDGE AT CENTER */
    transform: translateY(
        calc(-100% - var(--spread))
    );

    will-change: transform;
}

/* BOTTOM ROLL - MEETS CENTER, MOVES DOWN */

.scroll-bottom {
    position: absolute;
    left: -20%;
    top: 50%;
    display: block;
    width: 140%;
    height: auto;
    z-index: 3;

    /* CLOSED: TOP EDGE AT CENTER */
    transform: translateY(var(--spread));

    will-change: transform;
}

/* SCROLL INSTRUCTION - DIRECTLY BELOW CLOSED SCROLL */

.scroll-hint {
    position: absolute;
    top: calc(50% + min(21.9vw, 124px) + 18px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;

    padding: 10px 17px;
    white-space: nowrap;

    color: #8c683b;
    font-family: 'Marcellus', serif;
    font-size: 10px;
    letter-spacing: 3px;

    background: rgba(255,248,231,.48);
    border: 1px solid rgba(190,151,91,.55);
    border-radius: 3px;

    box-shadow:
        0 3px 12px rgba(70,45,18,.10),
        0 1px 4px rgba(255,255,255,.5) inset;

    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);

    opacity: 1;
    transition: opacity .25s ease;
    animation: hintBreathe 2s ease-in-out infinite;
}

@keyframes hintBreathe {
    0%,100% { opacity: .65; }
    50% { opacity: 1; }
}

/* MOBILE */

@media (max-width: 480px) {

    .page-dots {
        left: 7px;
    }

    .dots-pill {
        padding: 8px 5px;
        gap: 9px;
    }

    .scroll-composition {
        width: 58vw;
    }

    .scroll-hint {
        top: calc(50% + 21.9vw + 18px);
        font-size: 9px;
        letter-spacing: 2.5px;
        padding: 9px 13px;
    }

    .intro-content {
        transform: translateY(6vh);
    }
}
</style>
</head>

<body>

<!-- PAGE 1 -->

<section class="scene" id="page1">

    <img src="background.JPG" class="background" alt="">

    <div class="intro">
        <div class="intro-content">

            <div class="intro-line bismillah line-1">
                بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
            </div>

            <div class="intro-line verse line-2">
                And We created you in pairs
            </div>

            <div class="intro-line families line-3">
                THE FAMILIES OF
            </div>

            <div class="intro-line name line-4">
                Ayzal Fatemah
            </div>

            <div class="intro-line ampersand line-5">
                &
            </div>

            <div class="intro-line name line-6">
                Zubair Ali
            </div>

            <div class="intro-line request line-7">
                request the honour of your presence<br>
                at their nikkah
            </div>

        </div>
    </div>

    <!-- LEFT GATE -->

    <div class="gate left-gate">

        <img src="left-gate.PNG" class="gate-image" alt="">

        <img src="brooch.PNG"
             class="brooch-half brooch-left" alt="">

        <div class="led-ring left-led">
            <div class="led-orbit">
                <span class="led-dot" style="--i:0"></span>
                <span class="led-dot" style="--i:1"></span>
                <span class="led-dot" style="--i:2"></span>
                <span class="led-dot" style="--i:3"></span>
                <span class="led-dot" style="--i:4"></span>
                <span class="led-dot" style="--i:5"></span>
                <span class="led-dot" style="--i:6"></span>
                <span class="led-dot" style="--i:7"></span>
                <span class="led-dot" style="--i:8"></span>
                <span class="led-dot" style="--i:9"></span>
                <span class="led-dot" style="--i:10"></span>
                <span class="led-dot" style="--i:11"></span>
            </div>
        </div>

    </div>

    <!-- RIGHT GATE -->

    <div class="gate right-gate">

        <img src="right-gate.PNG" class="gate-image" alt="">

        <img src="brooch.PNG"
             class="brooch-half brooch-right" alt="">

        <div class="led-ring right-led">
            <div class="led-orbit">
                <span class="led-dot" style="--i:0"></span>
                <span class="led-dot" style="--i:1"></span>
                <span class="led-dot" style="--i:2"></span>
                <span class="led-dot" style="--i:3"></span>
                <span class="led-dot" style="--i:4"></span>
                <span class="led-dot" style="--i:5"></span>
                <span class="led-dot" style="--i:6"></span>
                <span class="led-dot" style="--i:7"></span>
                <span class="led-dot" style="--i:8"></span>
                <span class="led-dot" style="--i:9"></span>
                <span class="led-dot" style="--i:10"></span>
                <span class="led-dot" style="--i:11"></span>
            </div>
        </div>

    </div>

    <div class="tap-area" id="tapArea">
        <div class="tap-text">TAP TO OPEN</div>
    </div>

</section>

<!-- PAGE 2 -->

<section class="scroll-section" id="page2">

    <div class="scroll-stage">

        <img src="bg.JPG" class="scroll-bg" alt="">

        <div class="scroll-composition" id="scrollComposition">

            <div class="scroll-middle">
                <img src="msg.PNG" alt="">
            </div>

            <img src="top.PNG" class="scroll-top" alt="">

            <img src="bottom.PNG" class="scroll-bottom" alt="">

        </div>

        <div class="scroll-hint" id="scrollHint">
            SCROLL TO UNROLL
        </div>

    </div>

</section>

<!-- LEFT PAGE INDICATOR -->

<div class="page-dots">
    <div class="dots-pill">
        <span class="page-dot active" data-page="1"></span>
        <span class="page-dot" data-page="2"></span>
        <span class="page-dot" data-page="3"></span>
        <span class="page-dot" data-page="4"></span>
        <span class="page-dot" data-page="5"></span>
        <span class="page-dot" data-page="6"></span>
    </div>
</div>

<script>

/* GATE OPENING */

const scene = document.getElementById("page1");
const tapArea = document.getElementById("tapArea");

let opened = false;

tapArea.addEventListener("click", function() {

    if (opened) return;

    opened = true;

    scene.classList.add("opening");

    setTimeout(function() {

        document.documentElement.classList.add("site-open");
        document.body.classList.add("site-open");

        updateScrollDesign();

    }, 5800);

});

/* PAGE 2 - CONNECTED SCROLL REVEAL */

const page2 = document.getElementById("page2");

const scrollComposition =
    document.getElementById("scrollComposition");

const scrollHint =
    document.getElementById("scrollHint");

const dots =
    document.querySelectorAll(".page-dot");

function updateScrollDesign() {

    if (!document.body.classList.contains("site-open")) {
        return;
    }

    const sectionTop =
        page2.getBoundingClientRect().top + window.scrollY;

    const sectionHeight =
        page2.offsetHeight;

    const viewportHeight =
        window.innerHeight;

    const start = sectionTop;

    const end =
        sectionTop + sectionHeight - viewportHeight;

    const currentY = window.scrollY;

    page2.classList.remove(
        "is-pinned",
        "is-ended"
    );

    if (currentY >= start && currentY < end) {

        page2.classList.add("is-pinned");

    } else if (currentY >= end) {

        page2.classList.add("is-ended");

    }

    let progress =
        (currentY - start) /
        Math.max(1, end - start);

    progress =
        Math.max(0, Math.min(1, progress));

    const compositionWidth =
        scrollComposition.clientWidth;

    const messageFullHeight =
        compositionWidth * (1242 / 632);

    const maxSpread =
        messageFullHeight / 2;

    const currentSpread =
        maxSpread * progress;

    scrollComposition.style.setProperty(
        "--spread",
        currentSpread + "px"
    );

    /* HIDE INSTRUCTION AS SOON AS SCROLL STARTS */

    scrollHint.style.opacity =
        progress > 0.002 ? "0" : "1";

    const activePage =
        currentY >= start - 10 ? 1 : 0;

    dots.forEach(function(dot, index) {

        dot.classList.toggle(
            "active",
            index === activePage
        );

    });

}

/* SCROLL LISTENER */

window.addEventListener(
    "scroll",
    updateScrollDesign,
    { passive: true }
);

/* RESIZE LISTENER */

window.addEventListener(
    "resize",
    updateScrollDesign
);

/* INITIAL STATE */

updateScrollDesign();

</script>

</body>
</html>
